$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@inventaris.test",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.token) pm.collectionVariables.set('token', res.token);
      pm.test('dapat token', () => pm.expect(res.token).to.be.a('string'));
    language: text/javascript
order: 2000
